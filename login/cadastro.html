<!DOCTYPE html>
<html lang="pt-BR" method="post">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar-se | ARCHIVA</title>~
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
</head>
<body>
    <fieldset class="login-container">
        <a href="login.html"><img src="img/logo.png" alt="Imagen de logo"></a>
        <form action="">
            <div class="input-container">
                <input type="text" name="name" id="name" maxlength="30" autocomplete="name" placeholder=" " required>
                <label for="name">Nome completo</label>
            </div>
            <div class="input-container">
                <input type="text" name="username" id="username" maxlength="20" autocomplete="username" placeholder=" " required>
                <label for="username">Nome de usuário</label>
            </div>
            <div class="input-container">
                <input type="email" name="email" id="email" maxlength="100" autocomplete="email" placeholder=" " required>
                <label for="email">Digitar Email</label>
            </div>
            <div class="input-container">
                <input type="tel" name="phone" id="phone"  maxlength="15" autocomplete="tel" placeholder=" "pattern="^\(\d{2}\)\d{4,5}-\d{4}$" required>
                <label for="phone">Número de tel</label>
            </div>
            <div class="input-container">
                <input type="date" name="birthdate" id="birthdate" autocomplete="bday" placeholder=" " required>
                <label for="birthdate">Data de nascimento</label>
            </div>
            <div class="input-container">
                <input type="text" name="numero"  id="numero" min="9" max="20" placeholder=" " required>
                <label for="numero">Número de BI</label>
            </div>
            <div class="input-container">
                <select class="genero" id="genero" name="genero" required>
                    <option value="">Gênero</option>
                    <option value="masculino">Masculino</option>
                    <option value="feminino">Feminino</option>
                    <option value="outro">Outro</option>
                </select>
            </div>
            <div class="input-container">
                <input type="password" id="password" placeholder=" " minlength="8" maxlength="16"  required>
                <label for="password">Criar Senha</label>
            </div>
            <div class="input-container">
                <input type="password" id="confirm-password" placeholder=" " minlength="8" maxlength="16"  required>
                <label for="confirm-password">Confirmar Senha</label>
            </div>
            <button>Cadastrar</button>
        </form>
    </fieldset>
</body>
</html>
