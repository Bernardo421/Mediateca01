<!DOCTYPE html>
<html lang="Pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ARCHIVA</title>
    <link rel="stylesheet" href="css/cadastro.css">
    <link rel="shortcut icon" href="../img/icon.png" type="image/x-icon">
</head>
<body>
    
    <section class="secao1">
        <div class="voltar">
                <a href="login.html"><img src="../img/seta-esquerda-icon.png" alt=""></a>
            </div>
        <div class="container">
            
            <h3>Criar conta no ARCHIVA</h3>
            <form action="" method="post">
                <div class="input-container">
                    <input type="text" id="userName" name="username"  autocomplete="username" placeholder=" " required>
                    <label for="userName">Nome de utilizador</label>
                </div>
                <div class="input-container">
                    <input type="date" autocomplete="bday" id="data" name="data_de_nascimento" placeholder=" " required>
                    <label for="data">Data de nascimento</label>
                </div>
                 <div class="input-container">
                    <input type="text" placeholder=" " id="nBI" name="identidade" pattern="[0-9]{9}[A-Z]{2}[0-9]{3}" required>
                     <label for="nBI">Numero de BI</label>
                </div>
                <div class="input-container">
                    <select id="genero" required>
                        <option value="" disabled selected>Genero</option>
                        <option value="masc">Masculino</option>
                        <option value="fem">Femenino</option>
                        <option value="pers">Personalizado</option>
                    </select>
                    <label for="genero"></label>
                </div>
                <div class="input-container">
                    <input type="tel" autocomplete="tel" id="numero" name="inumero" placeholder=" " required>
                     <label for="numero">Numero de telefone</label>
                </div>
                <div class="input-container">
                    <input type="email" autocomplete="email" id="email" name="iemail" placeholder=" " required>
                    <label for="email">Email</label>
                </div>
                <div class="input-container">
                    <input type="password" placeholder=" " id="senha" min="8" max="16" name="isenha" required>
                     <label for="senha">Senha</label>
                </div>
                 <div class="input-container">
                    <input type="password" placeholder=" " id="csenha" min="8" max="16" name="Confsenha" required>
                    <label for="csenha">Confirmar senha</label>
                </div>
                <button type="submit">Enviar</button>
            </form>
        </div>
</section>
<section class="secao2">
    <img src="../img/logop.png" class="logo" alt="Logo do site" loading="lazy">
    <img src="../img/Designer (7).png" class="panfleto" alt="Panfleto do site" loading="lazy">

</section>
<script src="js/condi.js"></script>
</body>
</html>
