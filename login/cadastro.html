<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | ARCHIVA</title>
    <link rel="stylesheet" href="css/cadastro.css">
</head>
<body>
    <div class="conteiner">
        <form action="" method="post">
            <div>
                <label for="userName">Nome de utilizador</label>
                <input type="text" autocomplete="cc-name" placeholder=" " required>
            </div>
            <div>
                <label for="dataDeNascimento">Data de nascimento</label>
                <input type="date" autocomplete="bday-year" placeholder=" " required>
            </div>
            <div>
                <label for="genero">Genero</label>
                <select>
                    <option value="masc">Masculino</option>
                    <option value="fem">Femenino</option>
                    <option value="pers">Personalizado</option>
                </select>
            </div>
            <div>
                <label for="numero">Numero de telefone</label>
                <input type="number" autocomplete="cc-number" placeholder=" " required>
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" autocomplete="email" placeholder=" " required>
            </div>
            <div> 
                <label for="senha">Senha</label>
                <input type="password" required>
            </div>
            <button>Enviar</button>
        </form>
    </div>
</body>
</html>
