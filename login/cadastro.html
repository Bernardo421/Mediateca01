    <section class="secao2">
        <div class="login-container">
            <h1>Crie a sua conta</h1>
            <br>
            <h3>Junte-se à comunidade ARCHIVA</h3>

            <form id="form-cadastro" action="cadastro.php" method="post" novalidate>

                <div class="input-container">
                    <input type="text" id="nome" name="nome" placeholder=" " minlength="3" maxlength="40" autocomplete="username" required>
                    <label for="nome">Nome de utilizador</label>
                </div>

                <div class="linha">
                    <div class="input-container fixo">
                        <input type="date" id="nascimento" name="nascimento" required>
                        <label for="nascimento">Data de nascimento</label>
                    </div>
                    <div class="input-container fixo">
                        <select id="genero" name="genero" required>
                            <option value="" selected disabled>Selecionar</option>
                            <option value="M">Masculino</option>
                            <option value="F">Feminino</option>
                            <option value="O">Outro</option>
                        </select>
                        <label for="genero">Género</label>
                    </div>
                </div>

                <div class="linha">
                    <div class="input-container">
                        <input type="tel" id="telefone" class="telbi" name="telefone" placeholder=" " inputmode="tel" pattern="[0-9+ ]{9,15}" autocomplete="tel" required>
                        <label for="telefone">Telefone</label>
                    </div>
                    <div class="input-container">
                        <input type="text" id="bi" class="telbi" name="bi" placeholder=" " maxlength="14" style="text-transform:uppercase" required>
                        <label for="bi">Nº do BI</label>
                    </div>
                </div>

                <div class="input-container">
                    <input type="email" id="email" name="email" placeholder=" " autocomplete="email" required>
                    <label for="email">Email</label>
                </div>

                <div class="input-container">
                    <input type="password" id="password" name="password" placeholder=" " minlength="8" maxlength="16" autocomplete="new-password" required>
                    <label for="password">Senha</label>
                </div>

                <div class="input-container">
                    <input type="password" id="confirmar" name="confirmar" placeholder=" " minlength="8" maxlength="16" autocomplete="new-password" required>
                    <label for="confirmar">Confirmar senha</label>
                </div>

                <p class="erro-msg" id="erro" role="alert" aria-live="polite"></p>

                <button type="submit" class="btn-principal">Criar conta</button>
            </form>
            <br>
            <p class="cadastrar">Já tem conta? <a href="login.html">Iniciar sessão</a></p>
        </div>
    </section>

<script src="js/login.js"></script>
