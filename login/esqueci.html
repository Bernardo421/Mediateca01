<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esqueci a Senha | ARCHIVA</title>
    <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
        <div class="login-container">
            <img src="img/logo.png" alt="Imagen de logo">
            <p class="para"></p>
            <div class="para">
                <h1>Digite o seu email para redefinir a senha:</h1>
            </div>
            <br>
            <form action="digite_codigo.html" method="post">
                <div class="input-container">
                    <input type="email" id="username" placeholder=" " required autocomplete="on">
                    <label>Email</label>
                </div>
                <button type="submit" class="btn-principal">Enviar</button>
            </form>
            <a href="cadastro.html" class="link">Voltar para o login</a>
        </div>
</body>
</html>
