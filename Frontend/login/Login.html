<!DOCTYPE html>
<html lang="PT BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ARCHIVA</title>
    <link rel="stylesheet" href="../estilo/estilo.css">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
</head>
<body>
    <div class="">
        <img src="./image/log_do_site.png" alt="Logo do site">
        <form action="">
            <div>
                <input type="email" placeholder=" " autocomplete="email" id="email" required>
                <label for="email">E-mail</label>
            </div>
            <div>
                <input type="password" autocomplete="current-password" placeholder=" " id="password" required>
                <label for="password">Senha</label>
            </div>
            <button type="submit">Entrar</button>
        </form>
        <a href="">Esqueceu sua senha?</a>
        <button>Cadastrar </button>
    </div>
    
</body>
</html>
