<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ARCHIVA</title>
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="shortcut icon" href="img/icon.png" type="image/x-icon">
</head>
<body>
    <div class="login-container">
        <img src="img/logo.png" alt="Imagen de logo">
        <form action="">
            <div class="input-container">
                <input type="email" id="username" placeholder=" " required>
                <label for="username">Email</label>
            </div>
            <div class="input-container">
                <input type="password" id="password" placeholder=" " minlength="8" maxlength="16"  required>
                <label for="password">Senha</label>
            </div>
            <button>Entrar</button>
        </form>
        <a href="#">Esqueceu a senha?</a>
        <br>
        <a href="cadastro.html"><button>Criar Conta</button></a>
    </div>
    
</body>
</html>
